<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>FLAP 作品 · 战棋对战</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topRow">
        <div class="brandBlock">
          <div class="brandName">FLAP 作品</div>
          <div class="titleWrap">
            <div class="gameTitle">战棋对战</div>
            <div class="gameSubtitle">经典棋盘皮肤 · 点击英雄查看详细信息</div>
          </div>
        </div>

        <div class="topRightBadges">
          <span id="phaseBadge" class="badge gold">阶段：—</span>
          <span id="turnBadge" class="badge">回合：—</span>
          <span id="turnTeamBadge" class="badge turn">当前行动：—</span>
          <span id="matchBadge" class="badge">本地双人</span>
        </div>
      </div>

      <div class="topDeck">
        <section class="logDock card">
          <div class="panelHeader">
            <h3>战斗日志</h3>
            <button id="clearLogBtn" class="textBtn">清空</button>
          </div>
          <div id="log" class="log"></div>
        </section>

        <section id="blueCard" class="card teamCard compact">
          <h3>蓝方</h3>
          <div id="blueHud" class="small teamHudLine">—</div>
          <div class="bar ap"><div id="blueApBar" style="width:0%"></div></div>
          <div id="blueSummary" class="teamSummary">—</div>
        </section>

        <section id="redCard" class="card teamCard compact">
          <h3>红方</h3>
          <div id="redHud" class="small teamHudLine">—</div>
          <div class="bar ap"><div id="redApBar" style="width:0%"></div></div>
          <div id="redSummary" class="teamSummary">—</div>
        </section>
      </div>
    </header>

    <main class="mainArea">
      <section class="gridWrap">
        <div class="boardHeader">
          <div class="boardAxisX" id="boardLabelsX"></div>
        </div>
        <div class="boardMain">
          <div class="boardAxisY" id="boardLabelsY"></div>
          <div id="grid" class="grid"></div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="row space">
          <div id="selectedPill" class="pill">未选择英雄</div>
          <div id="selectedState" class="pill">—</div>
        </div>

        <div class="sep"></div>

        <div class="heroCard">
          <strong>点击提示</strong>
          <div class="hintText">点击棋盘上的英雄后，下方会显示该英雄的头像、被动、主动技能与可执行操作。</div>
        </div>
      </aside>
    </main>

    <footer class="controls">
      <div class="inner">
        <div id="skillBar" class="skillBar footerSkillBar"></div>
        <div class="btnRow">
          <button id="btnDeselect" class="btnGhost">取消选择</button>
          <button id="btnEndTurn" class="btnGood">结束回合</button>
        </div>
      </div>
    </footer>

    <section class="actionDock card" id="actionDock">
      <div class="panelHeader">
        <h3>英雄信息与技能</h3>
        <div class="small">点选英雄后显示详细内容</div>
      </div>

      <div class="actionDockGrid">
        <div class="actionDockPane actionDockHero">
          <div id="selectedInfo" class="heroCard">
            <div class="hintText">点击棋盘上的英雄查看属性、被动、技能与当前状态。</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <div id="overlayContent"></div>
    </div>
  </div>

  <div id="rotateHint" class="rotateHint" aria-live="polite">
    请切换到横屏后继续游玩
  </div>

  <script src="heroes.js"></script>
  <script src="game.js"></script>
</body>
</html>
