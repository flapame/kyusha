<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>9×4 战棋对战</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    页面结构说明：
    1) 顶部信息栏：显示回合、阵营 AP、当前阶段。
    2) 顶部操作面板：放玩家操作情况与战斗日志。
    3) 棋盘：9×4 战斗地图。
    4) 侧边信息栏：显示被选中英雄的头像、属性、被动和技能说明。
    5) 底部控制栏：技能按钮、行动模式切换、结束回合。

    以后如果你只是想改显示布局，优先改这个文件和 style.css。
  -->

  <div id="app">
    <div class="overlay" id="overlay">
      <div class="modal" id="overlayContent"></div>
    </div>

    <div class="topbar">
      <div class="wrap">
        <div class="row space">
          <div class="row">
            <span class="badge gold"><strong>9×4</strong> 战棋对战</span>
            <span class="badge" id="phaseBadge">阶段：准备中</span>
            <span class="badge" id="turnBadge">回合：0</span>
          </div>
          <div class="row">
            <span class="badge blue" id="blueApBadge">蓝方 AP：0</span>
            <span class="badge red" id="redApBadge">红方 AP：0</span>
          </div>
        </div>

        <div class="hud">
          <div class="card">
            <h3>蓝方</h3>
            <div class="small" id="blueSummary">等待开始</div>
            <div class="bar ap"><div id="blueApBar" style="width:0%"></div></div>
          </div>
          <div class="card">
            <h3>红方</h3>
            <div class="small" id="redSummary">等待开始</div>
            <div class="bar ap"><div id="redApBar" style="width:0%"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="battlePanel">
      <div class="battlePanelCol battleActionCol">
        <div class="panelTitle">玩家操作情况</div>
        <div class="actionGrid" id="battleStatus"></div>
      </div>
      <div class="battlePanelCol battleLogCol">
        <div class="panelTitle">战斗日志</div>
        <div class="log compactLog" id="log"></div>
      </div>
    </div>

    <div class="wrap">
      <div class="gridWrap">
        <div class="grid" id="grid"></div>
      </div>

      <div class="sidebar">
        <div class="row space">
          <div>
            <span class="pill" id="selectedPill">未选择英雄</span>
          </div>
          <div class="row">
            <button class="btnGhost" id="btnDeselect">取消选择</button>
            <button class="btnGood" id="btnEndTurn">结束回合</button>
          </div>
        </div>

        <div class="sep"></div>

        <div id="selectedInfo" class="hintText">
          点击一位已部署的英雄，查看属性、被动与技能。
        </div>

        <div class="sep"></div>
        <div class="ruleBox softBox">
          <strong>操作提示</strong>
          <div class="small">点击英雄后，可在下方切换移动、攻击、技能模式。技能卡会显示完整消耗与效果说明。</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="inner">
        <div class="skillBar" id="skillBar"></div>
        <div class="btnRow" id="actionRow">
          <button class="btnGhost" id="btnMoveMode">移动</button>
          <button class="btnGhost" id="btnAttackMode">攻击</button>
          <button class="btnGhost" id="btnSkillMode">技能</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./heroes.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
